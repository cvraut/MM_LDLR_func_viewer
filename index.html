<!doctype html>
<!--
  index.html: page shell. Vite turns this into dist/index.html with all code,
  styles and data inlined. %APP_TITLE% is replaced with `title` from
  tracks.config.ts at build time. The app renders into #app (see src/main.ts).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>" />
    <title>%APP_TITLE%</title>
  </head>
  <body>
    <div id="app"><noscript>This genome browser needs JavaScript.</noscript></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
