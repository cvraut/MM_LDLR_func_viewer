pe in the position box</td>\\n<td>Jump to <code>chr7:55,100,001-55,150,000</code> or a chromosome name</td>\\n</tr>\\n<tr>\\n<td>Zoom slider, top right</td>\\n<td>Zoom from a whole chromosome down to single bases</td>\\n</tr>\\n<tr>\\n<td>← / → keys</td>\\n<td>Move 10% left or right</td>\\n</tr>\\n</tbody>\\n</table>\\n<p>At the highest zoom the sequence track shows individual bases.</p>\\n<h2 id=\\"arranging-tracks\\">Arranging tracks</h2>\\n<ul>\\n<li><strong>Reorder:</strong> drag a track name (or the dotted grip that appears on hover) up or down.</li>\\n<li><strong>Hide:</strong> hover a track name and click ×. Hidden tracks wait in the <em>Hidden tracks</em> tray under the viewer.</li>\\n<li><strong>Bring back:</strong> click a track in the tray to add it at the bottom, or drag it to the exact place you want.</li>\\n<li><strong>Display options:</strong> right-click a track name to change how it is drawn.</li>\\n</ul>\\n<p>Your arrangement is remembered in this browser. <strong>Reset view</strong> in the toolbar restores the original layout and position.</p>\\n</div><section class=\\"help-tracks\\"><h2 id=\\"tracks\\">Tracks</h2><section class=\\"help-track\\" id=\\"track-sequence\\">\\n<h3><span class=\\"swatch\\" style=\\"background:#5b5f66\\"></span>Sequence</h3>\\n<dl class=\\"facts\\"><dt>Source file</dt><dd><code>genome\\\\demo_sequence.fa</code></dd><dt>Format</dt><dd>FASTA</dd><dt>Bases</dt><dd>300,000</dd><dt>Regions</dt><dd>chr7:55,000,001-55,300,000</dd></dl><p>Reference bases from <code>genome/demo_sequence.fa</code>. The demo sequence is random and is <strong>not</strong> real hg38. Zoom in until letters appear; at intermediate zoom each base is a colored tick.</p>\\n</section><section class=\\"help-track\\" id=\\"track-demo_genes\\">\\n<h3><span class=\\"swatch\\" style=\\"background:#1d2127\\"></span>demo_genes.bed</h3>\\n<dl class=\\"facts\\"><dt>Source file</dt><dd><code>demo_genes.bed</code></dd><dt>Format</dt><dd>BED12</dd><dt>Features</dt><dd>4</dd><dt>Chromosomes</dt><dd>chr7</dd><dt>Description</dt><dd>Synthetic gene models for the demo</dd></dl><p>Gene models drawn from a BED12 file. Thick blocks are coding exons, thinner blocks are untranslated regions, and the line with arrows shows introns and the direction of transcription.</p>\\n<p>Right-click the track (it has no visible name, so right-click the empty space on its left) to switch between <em>dense</em>, <em>squish</em>, <em>pack</em> and <em>full</em>.</p>\\n</section><section class=\\"help-track\\" id=\\"track-demo_sprn\\">\\n<h3><span class=\\"swatch\\" style=\\"background:#7466b4\\"></span>SPRn</h3>\\n<dl class=\\"facts\\"><dt>Source file</dt><dd><code>demo_sprn.wig</code></dd><dt>Format</dt><dd>wig</dd><dt>Data intervals</dt><dd>5,943</dd><dt>Chromosomes</dt><dd>chr7</dd><dt>Value range</dt><dd>0 to 8.9</dd><dt>Description</dt><dd>Synthetic screen signal, -log10 p</dd></dl><p>This file is <code>help/tracks/demo_sprn.md</code>. Each track can have its own help file named after the track file without its extension.</p>\\n<p>Write what the assay measures, how the data was processed and how to interpret it. For example:</p>\\n<ul>\\n<li><strong>Assay:</strong> a made-up screen, shown as −log₁₀ p per 50 bp window.</li>\\n<li><strong>Hits:</strong> windows with −log₁₀ p ≥ 3, drawn in the row underneath.</li>\\n<li><strong>Scale:</strong> SPRn, SPRi and SPRa share one y-axis range (<code>autoscaleGroup: 'spr'</code> in <code>tracks.config.ts</code>) so heights are comparable.</li>\\n</ul>\\n</section><section class=\\"help-track\\" id=\\"track-demo_sprn_hits\\">\\n<h3><span class=\\"swatch\\" style=\\"background:#7466b4\\"></span>demo_sprn_hits.bed</h3>\\n<dl class=\\"facts\\"><dt>Source file</dt><dd><code>demo_sprn_hits.bed</code></dd><dt>Format</dt><dd>BED6</dd><dt>Features</dt><dd>75</dd><dt>Chromosomes</dt><dd>chr7</dd></dl></section><section class=\\"help-track\\" id=\\"track-demo_spri\\">\\n<h3><span class=\\"swatch\\" style=\\"background:#e
